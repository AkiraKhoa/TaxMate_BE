version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taxmate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taxmate_db
    ports:
      - "5432:5432"
    volumes:
      - taxmate_pgdata:/var/lib/postgresql/data

volumes:
  taxmate_pgdata:
